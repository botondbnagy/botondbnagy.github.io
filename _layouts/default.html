<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <main class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
      </div>
    </main>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>
      {% endfor %}
    {% endif %}
    <button id="theme-toggle" aria-label="Toggle dark mode" style="border: none; background: none; background-image: url('assets/moon.png'); background-size: cover; width: 40px; height: 40px; position: fixed; bottom: 20px; right: 20px; z-index: 100;"></button>
    <script>
      var body = document.body;
      var button = document.getElementById('theme-toggle');

      // Apply the theme on page load
      var theme = localStorage.getItem('theme') || 'light';
      body.setAttribute('a', theme);
      button.style.backgroundImage = theme === 'dark' ? "url('assets/sun.png')" : "url('assets/moon.png')";

      button.addEventListener('click', function() {
        if (body.getAttribute('a') === 'dark') {
          body.setAttribute('a', 'light');
          button.style.backgroundImage = "url('assets/moon.png')";
          localStorage.setItem('theme', 'light');
        } else {
          body.setAttribute('a', 'dark');
          button.style.backgroundImage = "url('assets/sun.png')";
          localStorage.setItem('theme', 'dark');
        }
      });
    </script>
  </body>
</html>
